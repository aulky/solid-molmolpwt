<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="pastry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="480" fill="url(#bg)"/>
  <circle cx="300" cy="240" r="180" fill="#FFFFFF" opacity="0.6"/>
  <!-- Plate -->
  <ellipse cx="300" cy="270" rx="190" ry="110" fill="#E8E8EC" opacity="0.5"/>
  <ellipse cx="300" cy="265" rx="180" ry="100" fill="#FFFFFF"/>
  <!-- Pastry items -->
  <g filter="url(#shadow)">
    <!-- Mol-Mol 1 -->
    <ellipse cx="240" cy="240" rx="65" ry="48" fill="url(#pastry)"/>
    <ellipse cx="240" cy="235" rx="55" ry="40" fill="#FBBF24"/>
    <!-- Sesame seeds -->
    <circle cx="225" cy="225" r="2.5" fill="#FFFFFF"/>
    <circle cx="245" cy="220" r="2.5" fill="#FFFFFF"/>
    <circle cx="260" cy="235" r="2.5" fill="#FFFFFF"/>
    <circle cx="230" cy="245" r="2.5" fill="#FFFFFF"/>
    <circle cx="250" cy="248" r="2.5" fill="#FFFFFF"/>
    <circle cx="215" cy="238" r="2.5" fill="#FFFFFF"/>
    <!-- Mol-Mol 2 -->
    <ellipse cx="350" cy="250" rx="68" ry="50" fill="url(#pastry)"/>
    <ellipse cx="350" cy="245" rx="58" ry="42" fill="#FBBF24"/>
    <circle cx="335" cy="235" r="2.5" fill="#FFFFFF"/>
    <circle cx="355" cy="230" r="2.5" fill="#FFFFFF"/>
    <circle cx="370" cy="245" r="2.5" fill="#FFFFFF"/>
    <circle cx="340" cy="255" r="2.5" fill="#FFFFFF"/>
    <circle cx="360" cy="258" r="2.5" fill="#FFFFFF"/>
    <!-- Mol-Mol 3 on top -->
    <ellipse cx="295" cy="205" rx="60" ry="45" fill="url(#pastry)"/>
    <ellipse cx="295" cy="200" rx="50" ry="38" fill="#FBBF24"/>
    <circle cx="280" cy="190" r="2.5" fill="#FFFFFF"/>
    <circle cx="300" cy="185" r="2.5" fill="#FFFFFF"/>
    <circle cx="315" cy="200" r="2.5" fill="#FFFFFF"/>
    <circle cx="285" cy="210" r="2.5" fill="#FFFFFF"/>
    <circle cx="305" cy="215" r="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Label Tag -->
  <rect x="220" y="380" width="160" height="32" rx="16" fill="#6366F1" opacity="0.1"/>
  <text x="300" y="401" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#6366F1" text-anchor="middle">Mol-Mol Original Wijen</text>
</svg>
