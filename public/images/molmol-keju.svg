<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFBF2"/>
      <stop offset="100%" stop-color="#F5F0DD"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#B45309" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="480" fill="url(#bg3)"/>
  <circle cx="300" cy="240" r="180" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="300" cy="270" rx="190" ry="110" fill="#E8E8EC" opacity="0.5"/>
  <ellipse cx="300" cy="265" rx="180" ry="100" fill="#FFFFFF"/>
  <g filter="url(#shadow3)">
    <ellipse cx="250" cy="245" rx="65" ry="48" fill="#F59E0B"/>
    <ellipse cx="340" cy="245" rx="65" ry="48" fill="#F59E0B"/>
    <ellipse cx="295" cy="205" rx="60" ry="45" fill="#FBBF24"/>
    <!-- Cheese shreds -->
    <rect x="270" y="180" width="28" height="4" rx="2" fill="#FEF08A" transform="rotate(15 270 180)"/>
    <rect x="290" y="190" width="32" height="4" rx="2" fill="#FDE047" transform="rotate(-20 290 190)"/>
    <rect x="310" y="185" width="26" height="4" rx="2" fill="#FEF08A" transform="rotate(40 310 185)"/>
    <rect x="260" y="200" width="30" height="4" rx="2" fill="#FACC15" transform="rotate(-10 260 200)"/>
    <rect x="285" y="210" width="35" height="4" rx="2" fill="#FEF08A" transform="rotate(25 285 210)"/>
    <rect x="315" y="215" width="25" height="4" rx="2" fill="#FDE047" transform="rotate(-35 315 215)"/>
  </g>
  <rect x="220" y="380" width="160" height="32" rx="16" fill="#6366F1" opacity="0.1"/>
  <text x="300" y="401" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#6366F1" text-anchor="middle">Mol-Mol Keju Gurih</text>
</svg>
